    try {
      var response = await fetch("https://viacep.com.br/ws/" + cep + "/json/");
      if (!response.ok) throw new Error("CEP não encontrado");
      var data = await response.json();
      if (data.erro) { showMessage("CEP não encontrado. Confira o número digitado."); return; }
      setValue(inputByPlaceholder("Bairro/Distrito"), data.bairro || "");
      setValue(inputByPlaceholder("Endereço"), data.logradouro || "");
      if (data.uf) {
        selectedUF = data.uf;
        await loadCities(selectedUF);
        selectedCity = data.localidade || "";
        updateLocationLabels();
      }
      if (!data.logradouro) showMessage("CEP localizado. Preencha o endereço, se necessário.");
    } catch (_) {
      showMessage("Não foi possível consultar o CEP agora. Você pode selecionar estado e cidade manualmente.");
    }
  }
  function showMessage(message) {
    var old = document.getElementById("cep-status-message");
    if (old) old.remove();
    var box = document.createElement("div");
    box.id = "cep-status-message";
    box.textContent = message;
    box.style.cssText = "position:fixed;z-index:100000;left:16px;right:16px;bottom:24px;max-width:408px;margin:auto;background:#222;color:#fff;padding:12px 14px;border-radius:10px;font:14px Inter,Arial,sans-serif;box-shadow:0 4px 20px #0003";
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 3500);
  }

  // Keep location fields editable even after automatic CEP lookup.
  document.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest("button") : null;
    if (!btn || !/^Salvar$/i.test((btn.innerText || "").trim())) return;
    e.preventDefault(); e.stopImmediatePropagation();
    var required = ["nome", "telefone", "email", "cep", "endereco", "cpf"];
    for (var i = 0; i < required.length; i++) {
      var field = document.querySelector('[data-field="' + required[i] + '"]');
      if (!field || !field.value.trim()) { showMessage("Preencha os campos obrigatórios antes de salvar."); if (field) field.focus(); return; }
    }
    if (!selectedUF || !selectedCity) { showMessage("Selecione o estado e a cidade."); openPicker(!selectedUF ? "state" : "city"); return; }
    var data = {
      name: (document.querySelector('[data-field="nome"]') || {}).value || "",
      nome: (document.querySelector('[data-field="nome"]') || {}).value || "",
      phone: (document.querySelector('[data-field="telefone"]') || {}).value || "",
      telefone: (document.querySelector('[data-field="telefone"]') || {}).value || "",
      email: (document.querySelector('[data-field="email"]') || {}).value || "",
      cep: cepInput.value,
      state: selectedUF,
      estado: selectedUF,
      uf: selectedUF,
      city: selectedCity,
      cidade: selectedCity,
      neighborhood: (inputByPlaceholder("Bairro/Distrito") || {}).value || "",
      bairro: (inputByPlaceholder("Bairro/Distrito") || {}).value || "",
      street: (inputByPlaceholder("Endereço") || {}).value || "",
      endereco: (inputByPlaceholder("Endereço") || {}).value || "",
      number: (inputByPlaceholder("Nº da residência") || {}).value || "",
      numero: (inputByPlaceholder("Nº da residência") || {}).value || "",
      complement: (inputByPlaceholder("Apartamento") || {}).value || "",
      complemento: (inputByPlaceholder("Apartamento") || {}).value || "",
      cpf: (document.querySelector('[data-field="cpf"]') || {}).value || ""
    };
    try {
      var order = JSON.parse(localStorage.getItem("tiktokshop:order") || "{}");
      order.address = data;
      localStorage.setItem("tiktokshop:order", JSON.stringify(order));
      localStorage.setItem("soarfly:address", JSON.stringify(data));
    } catch (_) {}
    window.location.href = "../checkout/index.html";
  }, true);
})();
</script>
